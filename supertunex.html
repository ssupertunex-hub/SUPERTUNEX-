<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>supertunex</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:Arial,sans-serif; background:linear-gradient(135deg,#111,#252525);
    color:white; text-align:center;
  }
  .card{
    width:min(90%,420px); padding:45px 25px; border:1px solid #444;
    border-radius:24px; background:rgba(255,255,255,.06);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  h1{font-size:42px;margin:0 0 10px;letter-spacing:2px}
  p{color:#bbb;font-size:17px}
  .tag{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:999px;
       background:#fff;color:#111;font-weight:bold}
  footer{margin-top:30px;color:#777;font-size:13px}
</style>
</head>
<body>
  <div class="card">
    <h1>supertunex</h1>
    <p>⚡ Just vibes. Create. Explore. Repeat.</p>
    <span class="tag">WELCOME</span>
    <footer>© supertunex</footer>
  </div>
</body>
</html>
